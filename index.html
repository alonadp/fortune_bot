<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Гадание — Adminka Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <div class="ambient-background" aria-hidden="true">
    <div class="ambient-blob ambient-blob--primary"></div>
    <div class="ambient-blob ambient-blob--secondary"></div>
    <div class="ambient-blob ambient-blob--accent"></div>
  </div>

  <div class="container">
    <header>
      <div class="header-row">
        <h1>Гадание</h1>
        <svg class="brand-symbol" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1" opacity="0.3"/>
          <path d="M20 7 L21.5 18.5 L28 20 L21.5 21.5 L20 33 L18.5 21.5 L12 20 L18.5 18.5 Z" fill="currentColor"/>
          <path d="M26.5 13.5 L25 15" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
          <path d="M13.5 26.5 L15 25" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        </svg>
      </div>
      <p class="subtitle">Что хочешь узнать сегодня?</p>
      <p class="daily-mood" id="dailyMood" style="display: none;">
        <svg width="12" height="12" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 8 L26 22 L40 24 L26 26 L24 40 L22 26 L8 24 L22 22 Z" fill="currentColor"/>
        </svg>
        <span id="dailyMoodText"></span>
      </p>
    </header>

    <main>
      <!-- Выбор типа гадания -->
      <div class="modes" id="modesScreen">
        <!-- Hero Card: Монетка -->
        <button class="hero-card mode-btn" data-mode="yesno" aria-label="Открыть гадание на монетке: Да или Нет">
          <div class="coin-preview" aria-hidden="true">
            <div class="coin-mini">
              <div class="coin-face">
                <span class="coin-text">ДА</span>
              </div>
            </div>
          </div>
          <div class="card-content">
            <h3>Монетка судьбы</h3>
            <p>Задай вопрос и узнай: Да или Нет</p>
          </div>
        </button>

        <!-- Grid Cards -->
        <div class="grid-cards">
          <button class="card-item mode-btn" data-mode="taro" aria-label="Открыть гадание на картах Таро">
            <div class="tarot-preview" aria-hidden="true">
              <svg class="tarot-icon" width="46" height="66" viewBox="0 0 46 66" fill="none">
                <rect x="1" y="1" width="44" height="64" rx="7" stroke="currentColor" stroke-width="1.5" opacity="0.85"/>
                <rect x="6.5" y="6.5" width="33" height="53" rx="4.5" stroke="currentColor" stroke-width="1" opacity="0.35"/>
                <path d="M23 24 L24.6 31.4 L32 33 L24.6 34.6 L23 42 L21.4 34.6 L14 33 L21.4 31.4 Z" fill="currentColor" opacity="0.9"/>
              </svg>
            </div>
            <h3>Карта дня</h3>
            <p>Узнай, что готовит день</p>
          </button>

          <button class="card-item mode-btn" data-mode="rune" aria-label="Открыть гадание на рунах">
            <div class="rune-preview" aria-hidden="true">
              <svg class="rune-symbol" width="48" height="48" viewBox="0 0 48 48">
                <text x="24" y="36" text-anchor="middle" font-size="32" fill="currentColor">ᚠ</text>
              </svg>
            </div>
            <h3>Руна дня</h3>
            <p>Совет и знак на сегодня</p>
          </button>
        </div>

        <!-- Wide Card: Кубик мысли -->
        <button class="wide-card mode-btn" data-mode="dice" aria-label="Открыть Кубик мысли">
          <div class="dice-preview" aria-hidden="true">
            <div class="dice-mini">
              <span class="pip"></span>
              <span class="pip"></span>
              <span class="pip"></span>
            </div>
          </div>
          <div class="card-content">
            <h3>Кубик мысли</h3>
            <p>Брось и узнай, что тебе нужно услышать</p>
          </div>
        </button>

        <!-- Wide Card: Прогноз -->
        <button class="wide-card mode-btn" data-mode="day" aria-label="Получить прогноз на день">
          <svg class="celestial-icon" width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="18.5" stroke="currentColor" stroke-width="1" opacity="0.3"/>
            <path d="M20 8 L21.4 18.6 L28 20 L21.4 21.4 L20 32 L18.6 21.4 L12 20 L18.6 18.6 Z" fill="currentColor"/>
          </svg>
          <div class="card-content">
            <h3>Прогноз на день</h3>
            <p>Главная энергия и подсказка на сегодня</p>
          </div>
        </button>
      </div>

      <!-- Экран гадания -->
      <div class="fortune" id="fortuneScreen" style="display: none;">
        <button class="btn-back" id="backBtn">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M12 4 L6 10 L12 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Назад
        </button>
        
        <h2 id="fortuneTitle">Да / Нет</h2>

        <p class="fortune-subtitle" id="fortuneSubtitle" style="display: none;">Не знаешь, что тебе сейчас нужно услышать?</p>

        <div class="fortune-display">
          <!-- 3D Satin-Silver Coin -->
          <div class="coin" id="coin">
            <div class="coin-inner">
              <div class="coin-side coin-heads">
                <span class="coin-label">ДА</span>
              </div>
              <div class="coin-side coin-tails">
                <span class="coin-label">НЕТ</span>
              </div>
              <div class="coin-edge coin-edge--1" aria-hidden="true"></div>
              <div class="coin-edge coin-edge--2" aria-hidden="true"></div>
              <div class="coin-edge coin-edge--3" aria-hidden="true"></div>
              <div class="coin-edge coin-edge--4" aria-hidden="true"></div>
            </div>
          </div>

          <!-- Tarot Card -->
          <div class="card" id="card" style="display: none;">
            <div class="card-inner">
              <div class="card-back">
                <div class="card-pattern"></div>
              </div>
              <div class="card-front">
                <div class="card-image" id="tarotCardImage"></div>
                <div class="card-info">
                  <span class="card-number" id="tarotCardNumber"></span>
                  <span class="card-name" id="tarotCardName"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Rune Stone -->
          <div class="rune" id="rune" style="display: none;">
            <div class="rune-stone">
              <svg class="rune-symbol-large" width="120" height="120" viewBox="0 0 120 120">
                <text x="60" y="80" text-anchor="middle" font-size="64" id="runeSymbol">ᚠ</text>
              </svg>
            </div>
          </div>

          <!-- Question Mark for Daily -->
          <div class="question-mark" id="questionMark" style="display: none;" aria-hidden="true">?</div>

          <!-- 3D Thought Dice -->
          <div class="dice-scene" id="diceScene" style="display: none;" aria-hidden="true">
            <div class="dice" id="dice">
              <div class="dice-face dice-face--1">
                <span class="pip"></span>
              </div>
              <div class="dice-face dice-face--2">
                <span class="pip"></span><span class="pip"></span>
              </div>
              <div class="dice-face dice-face--3">
                <span class="pip"></span><span class="pip"></span><span class="pip"></span>
              </div>
              <div class="dice-face dice-face--4">
                <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
              </div>
              <div class="dice-face dice-face--5">
                <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
              </div>
              <div class="dice-face dice-face--6">
                <span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="prediction" id="prediction">
          <p>Нажми, чтобы узнать свою судьбу</p>
        </div>

        <p class="atmos-note" id="atmosNote" style="display: none;">
          <svg width="12" height="12" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 8 L26 22 L40 24 L26 26 L24 40 L22 26 L8 24 L22 22 Z" fill="currentColor"/>
          </svg>
          <span id="atmosNoteText"></span>
        </p>

        <button class="btn-primary" id="actionBtn">
          <span>Узнать</span>
        </button>

        <div class="history" id="history" style="display: none;">
          <h3>История</h3>
          <ul id="historyList"></ul>
        </div>

        <div class="monetization" style="display: none;">
          <button class="btn-secondary" id="watchAdBtn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 8 L13 10.5 L8 13 Z" fill="currentColor"/>
            </svg>
            Реклама (+1)
          </button>
          <button class="btn-secondary" id="buyStarsBtn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2 L11.5 7 L17 8.5 L11.5 10 L10 15 L8.5 10 L3 8.5 L8.5 7 Z" fill="currentColor"/>
            </svg>
            Купить Stars
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
